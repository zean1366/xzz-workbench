      <div id="f-cat-transfer" class="${ftype==='transfer'?'':'hidden'}">
        <div class="field"><label>往来分类</label><div class="seg" style="flex-wrap:wrap" id="f-transcat">${transCats.map(c=>`<div class="opt ${c===d.transferCategory?'on':''}" data-v="${attr(c)}" style="flex:0 0 auto">${esc(c)}</div>`).join("")}</div></div>
      </div>
      <div class="field"><label>支付方式</label><div class="seg" style="flex-wrap:wrap" id="f-paymethod">${payMethods.map(p=>`<div class="opt ${p===d.payMethod?'on':''}" data-v="${attr(p)}" style="flex:0 0 auto">${esc(p)}</div>`).join("")}</div></div>
      <div class="field"><label>日期</label><div class="date-cn-wrap"><input id="f-date" type="date" value="${d.date||isoToday()}" onchange="this.parentElement.querySelector('.date-cn-text').textContent=cnDate(this.value)"/><span class="date-cn-text">${cnDate(d.date||isoToday())}</span></div></div>
      <div class="field"><label>备注</label><textarea id="f-note" placeholder="补充说明" rows="2">${esc(d.note||'')}</textarea></div>`;
  } else if(m.type==="quickshop"){
    const moods = m.moods || [];
    const curMood = d.mood || moods[0];
    
    function renderQuickshopFields(moodKey){
      const sf = m.subFields?.[moodKey] || {};
      const lbl = sf.labels || {};
      const flist = sf.fields || [];
      let html = '';
      flist.forEach(fkey => {
        const label = lbl[fkey] || fkey;
        if(fkey === 'date') {
          html += `<div class="field"><label>${label}</label><div class="date-cn-wrap"><input id="f-date" type="date" value="${d.date||isoToday()}" onchange="this.parentElement.querySelector('.date-cn-text').textContent=cnDate(this.value)"/><span class="date-cn-text">${cnDate(d.date||isoToday())}</span></div></div>`;
        } else if(fkey === 'customer') {
          html += `<div class="field"><label>${label}</label><input id="f-customer" value="${attr(d.customer||'')}" placeholder="请输入姓名"/></div>`;
        } else if(fkey === 'amount' || fkey === 'principal' || fkey === 'giftAmount' || fkey === 'beforePrincipal' || fkey === 'beforeGift' || fkey === 'sessionNum') {
          html += `<div class="field"><label>${label}</label><input id="f-${fkey}" type="number" value="${d[fkey]??''}" placeholder="0"/></div>`;
        } else if(fkey === 'project' || fkey === 'giftProject') {
          const opts = sf.projects || sf.gifts || [];
          const curVal = d[fkey] || '';
          const isMulti = fkey === 'project' && moodKey !== '会员调理';
          const curArr = Array.isArray(curVal) ? curVal : (curVal ? [curVal] : []);
          if(isMulti) {
            html += `<div class="field"><label>${label}</label><div class="seg" style="flex-wrap:wrap" id="f-${fkey}" data-multi="1">${opts.map(o=>`<div class="opt ${curArr.includes(o)?'on':''}" data-v="${attr(o)}" style="flex:0 0 auto">${esc(o)}</div>`).join("")}</div></div>`;
          } else {
            html += `<div class="field"><label>${label}</label><div class="seg" style="flex-wrap:wrap" id="f-${fkey}">${opts.map(o=>`<div class="opt ${curVal===o?'on':''}" data-v="${attr(o)}" style="flex:0 0 auto">${esc(o)}</div>`).join("")}</div></div>`;
          }
        } else if(fkey === 'category') {
          const opts = sf.categories || [];
          html += `<div class="field"><label>${label}</label><div class="seg" style="flex-wrap:wrap" id="f-${fkey}" data-multi="1">${opts.map(o=>`<div class="opt ${(d[fkey]||[]).includes(o)?'on':''}" data-v="${attr(o)}" style="flex:0 0 auto">${esc(o)}</div>`).join("")}</div></div>`;
        } else if(fkey === 'payMethod') {
          const opts = sf.payMethods || [];
          html += `<div class="field"><label>${label}</label><div class="seg" style="flex-wrap:wrap" id="f-${fkey}">${opts.map(o=>`<div class="opt ${d[fkey]===o?'on':''}" data-v="${attr(o)}" style="flex:0 0 auto">${esc(o)}</div>`).join("")}</div></div>`;
        } else if(fkey === 'channel' || fkey === 'level' || fkey === 'firstTime') {
          const opts = sf[fkey==='channel'?'channels':(fkey==='level'?'levels':'firstTimeOptions')] || [];
          html += `<div class="field"><label>${label}</label><div class="seg" style="flex-wrap:wrap" id="f-${fkey}">${opts.map(o=>`<div class="opt ${d[fkey]===o?'on':''}" data-v="${attr(o)}" style="flex:0 0 auto">${esc(o)}</div>`).join("")}</div></div>`;
        } else if(fkey === 'focus' || fkey === 'beforeState' || fkey === 'duringFeel' || fkey === 'effect' || fkey === 'feedbackWord' || fkey === 'nextAdvice' || fkey === 'detail' || fkey === 'therapist') {
          html += `<div class="field"><label>${label}</label><input id="f-${fkey}" value="${attr(d[fkey]||'')}" placeholder="请输入${label}"/></div>`;
        } else if(fkey === 'note') {
          html += `<div class="field"><label>${label}</label><textarea id="f-note" placeholder="补充说明..." rows="2">${esc(d.note||'')}</textarea></div>`;
        } else {
          html += `<div class="field"><label>${label}</label><input id="f-${fkey}" value="${attr(d[fkey]||'')}"/></div>`;
        }
      });
      // 会员调理/散客消费支持客户实拍（调理前后对比），会员储值传充值凭证
      if(moodKey === '会员调理' || moodKey === '散客消费' || moodKey === '会员储值'){
        const photoLabel = moodKey === '会员储值' ? '充值凭证截图（可选）' : '客户实拍照片（调理前后对比，可选）';
        html += photoFieldHTML(photoLabel);
      }
      return html;
    }
    
    fields=`<div class="field"><label>类型</label><div class="seg" style="flex-wrap:wrap" id="f-mood">${moods.map(md=>`<div class="opt ${md===curMood?'on':''}" data-v="${attr(md)}" style="flex:0 0 auto">${md}</div>`).join("")}</div></div>
      <div id="quickshop-dynamic-fields">${renderQuickshopFields(curMood)}</div>`;
    
    window.__renderQSFields = renderQuickshopFields;
  } else if(m.type==="diary"){
    fields=`<div class="field"><label>内容</label><textarea id="f-content" rows="8" placeholder="今天发生了什么？想到啥写啥…">${esc(d.content||'')}</textarea></div>
      <div class="field"><label>日期</label><div class="date-cn-wrap"><input id="f-date" type="date" value="${d.date||isoToday()}" onchange="this.parentElement.querySelector('.date-cn-text').textContent=cnDate(this.value)"/><span class="date-cn-text">${cnDate(d.date||isoToday())}</span></div></div>
      ${photoFieldHTML('随手拍摄照片（可选）')}`;
  } else if(m.type==="weekly"){
    const cats = m.categories || [];
    const prios = m.priorities || [];
    const goalTypes = m.goalTypes || [];
    const stages = m.stages || [];
    fields=`<div class="field"><label>周次</label><input id="f-week" value="${attr(d.week||'')}" placeholder="如：10月第2周（10.6-10.12）"/></div>
      <div class="field"><label>重点内容</label><textarea id="f-title" rows="3" placeholder="具体要做什么">${esc(d.title||'')}</textarea></div>
      <div class="frow">
        <div class="field"><label>分类</label><div class="seg" style="flex-wrap:wrap" id="f-category">${cats.map(c=>`<div class="opt ${c===d.category?'on':''}" data-v="${attr(c)}" style="flex:0 0 auto;font-size:13px">${esc(c)}</div>`).join("")}</div></div>
        <div class="field"><label>优先级</label><div class="seg" style="flex-wrap:wrap" id="f-priority">${prios.map(c=>`<div class="opt ${c===d.priority?'on':''}" data-v="${attr(c)}" style="flex:0 0 auto;font-size:13px">${esc(c.split('（')[0])}</div>`).join("")}</div></div>
      </div>
      <div class="frow">
        <div class="field"><label>目标类型</label><div class="seg" id="f-goaltype">${goalTypes.map(c=>`<div class="opt ${c===d.goalType?'on':''}" data-v="${attr(c)}" style="font-size:13px">${esc(c.split('（')[0])}</div>`).join("")}</div></div>
        <div class="field"><label>量化目标</label><input id="f-quantified" type="number" value="${d.quantifiedTarget??''}" placeholder="数字"/></div>
      </div>
      <div class="field"><label>进展阶段</label><div class="seg" style="flex-wrap:wrap" id="f-stage">${stages.map(c=>`<div class="opt ${c===d.stage?'on':''}" data-v="${attr(c)}" style="flex:0 0 auto;font-size:13px">${esc(c)}</div>`).join("")}</div></div>
      <div class="frow">
        <div class="field"><label>开始日期</label><div class="date-cn-wrap"><input id="f-startdate" type="date" value="${d.startDate||''}" onchange="this.parentElement.querySelector('.date-cn-text').textContent=cnDate(this.value)"/><span class="date-cn-text">${cnDate(d.startDate||'')}</span></div></div>
        <div class="field"><label>结束日期</label><div class="date-cn-wrap"><input id="f-enddate" type="date" value="${d.endDate||''}" onchange="this.parentElement.querySelector('.date-cn-text').textContent=cnDate(this.value)"/><span class="date-cn-text">${cnDate(d.endDate||'')}</span></div></div>
      </div>
      <div class="field"><label>备注</label><textarea id="f-note" placeholder="补充说明" rows="2">${esc(d.note||'')}</textarea></div>`;
  } else if(m.type==="period"){
    const flows = m.flowAmounts || [];
    const pains = m.painLevels || [];
    const colors = m.colors || [];
    const textures = m.textures || [];
    const symptoms = m.symptoms || [];
    const emotions = m.emotions || [];
    const isEnded = d.status === "已结束";
    fields=`<div class="field"><label>状态</label><div class="seg" id="f-status">
        <div class="opt ${d.status==='经期中'?'on':''}" data-v="经期中" style="font-size:13px">经期中</div>
        <div class="opt ${isEnded?'on':''}" data-v="已结束" style="font-size:13px">已结束</div></div></div>
      <div class="frow">
        <div class="field"><label>开始日期</label><div class="date-cn-wrap"><input id="f-startdate" type="date" value="${d.startDate||''}" onchange="this.parentElement.querySelector('.date-cn-text').textContent=cnDate(this.value)"/><span class="date-cn-text">${cnDate(d.startDate||'')}</span></div></div>
        <div class="field ${isEnded?'':'hidden'}" id="f-endwrap"><label>结束日期</label><div class="date-cn-wrap"><input id="f-enddate" type="date" value="${d.endDate||''}" onchange="this.parentElement.querySelector('.date-cn-text').textContent=cnDate(this.value)"/><span class="date-cn-text">${cnDate(d.endDate||'')}</span></div></div>
      </div>
      <div class="frow">
        <div class="field"><label>经量</label><div class="seg" id="f-flow">${flows.map(c=>`<div class="opt ${c===d.flowAmount?'on':''}" data-v="${attr(c)}" style="font-size:13px">${esc(c)}</div>`).join("")}</div></div>
        <div class="field"><label>痛经</label><div class="seg" id="f-pain">${pains.map(c=>`<div class="opt ${c===d.painLevel?'on':''}" data-v="${attr(c)}" style="font-size:13px">${esc(c)}</div>`).join("")}</div></div>
      </div>
      <div class="field"><label>颜色</label><div class="seg" style="flex-wrap:wrap" id="f-color">${colors.map(c=>`<div class="opt ${c===d.color?'on':''}" data-v="${attr(c)}" style="flex:0 0 auto;font-size:13px">${esc(c)}</div>`).join("")}</div></div>
      <div class="field"><label>质地</label><div class="seg" style="flex-wrap:wrap" id="f-texture">${textures.map(c=>`<div class="opt ${c===d.texture?'on':''}" data-v="${attr(c)}" style="flex:0 0 auto;font-size:13px">${esc(c)}</div>`).join("")}</div></div>
      <div class="field"><label>身体症状（可多选）</label><div class="seg" style="flex-wrap:wrap" id="f-symptoms" data-multi="1">${symptoms.map(c=>`<div class="opt ${(d.symptoms||[]).includes(c)?'on':''}" data-v="${attr(c)}" style="flex:0 0 auto;font-size:13px">${esc(c)}</div>`).join("")}</div></div>
      <div class="field"><label>情绪（可多选）</label><div class="seg" style="flex-wrap:wrap" id="f-emotions" data-multi="1">${emotions.map(c=>`<div class="opt ${(d.emotions||[]).includes(c)?'on':''}" data-v="${attr(c)}" style="flex:0 0 auto;font-size:13px">${esc(c)}</div>`).join("")}</div></div>
      <div class="field"><label>备注</label><textarea id="f-note" placeholder="补充说明" rows="2">${esc(d.note||'')}</textarea></div>`;
  } else if(m.key==="content"){
    const stages = m.stages || ["选题池","文案中","待拍摄","已发布"];
    fields=`<div class="field"><label>阶段</label><div class="seg" style="flex-wrap:wrap" id="f-stage">${stages.map(s=>`<div class="opt ${s===d.stage?'on':''}" data-v="${attr(s)}" style="flex:0 0 auto">${s}</div>`).join("")}</div></div>
      <div class="field"><label>标题</label><input id="f-title" value="${attr(d.title)}" placeholder="给这条内容起个标题"/></div>
      <div class="field"><label>内容</label><textarea id="f-content" rows="8" placeholder="写点什么…">${esc(d.content||'')}</textarea></div>
      <div class="field"><label>日期</label><div class="date-cn-wrap"><input id="f-date" type="date" value="${d.date||isoToday()}" onchange="this.parentElement.querySelector('.date-cn-text').textContent=cnDate(this.value)"/><span class="date-cn-text">${cnDate(d.date||isoToday())}</span></div></div>
      ${photoFieldHTML('视频封面图（可选）')}`;
  } else { // note
    fields=`<div class="field"><label>标题</label><input id="f-title" value="${attr(d.title)}" placeholder="给这条起个名"/></div>
      ${(m.moods&&m.moods.length)?`<div class="field"><label>标签 / 心情</label><div class="seg" id="f-mood">${m.moods.map(md=>`<div class="opt ${md===d.mood?'on':''}" data-v="${attr(md)}" style="flex:0 0 auto">${md}</div>`).join("")}</div></div>`:''}
      <div class="field"><label>内容</label><textarea id="f-content" placeholder="写点什么…">${esc(d.content||'')}</textarea></div>
      <div class="field"><label>日期</label><div class="date-cn-wrap"><input id="f-date" type="date" value="${d.date||isoToday()}" onchange="this.parentElement.querySelector('.date-cn-text').textContent=cnDate(this.value)"/><span class="date-cn-text">${cnDate(d.date||isoToday())}</span></div></div>`;
  }

  // custom fields (from m.fields config)
  (m.fields||[]).forEach(f=>{
    const v=d[f.key]||"";
    if(f.type==="select") fields+=`<div class="field"><label>${esc(f.label)}</label><div class="seg" style="flex-wrap:wrap" id="f-cf-${f.key}">${(f.options||[]).map(o=>`<div class="opt ${o===v?'on':''}" data-v="${attr(o)}" style="flex:0 0 auto">${esc(o)}</div>`).join("")}</div></div>`;
    else if(f.type==="textarea") fields+=`<div class="field"><label>${esc(f.label)}</label><textarea id="f-cf-${f.key}" placeholder="${attr(f.placeholder||'')}">${esc(v)}</textarea></div>`;
    else if(f.type==="number") fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" type="number" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`;
    else fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`;
  });

  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><h3>${editing?'编辑 · '+m.name:m.name}</h3><div class="sub">${m.desc}</div>${fields}
    <div class="modal-actions">${editing?'<button class="link-danger" id="m-del">删除</button>':''}<div class="spacer"></div>
      <button class="btn ghost" id="m-cancel">取消</button><button class="btn" id="m-save">保存</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#m-cancel").onclick=close;
  // 照片选择绑定（编辑时回显已存照片，可删除）
  if(m.type==="quickshop"){
    const initMood = d.mood || (m.moods && m.moods[0]) || "";
    if(['会员调理','散客消费','会员储值'].includes(initMood)) bindPhotoInput(overlay, d.photo);
  } else if(m.type==="diary" || m.key==="content"){
    bindPhotoInput(overlay, d.photo);
  }
  // segmented pickers
  overlay.querySelectorAll(".seg").forEach(seg=>{
    const isMulti = seg.dataset.multi === "1";
    seg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
      if(isMulti){
        o.classList.toggle("on");
      } else {
        seg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on"));
        o.classList.add("on");
      }
    });
  });
  // finance 类型切换：显示对应分类
  if(m.type==="finance"){
    const typeSeg = overlay.querySelector("#f-ftype");
    if(typeSeg){
      typeSeg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
        typeSeg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on"));
        o.classList.add("on");
        const v = o.dataset.v;
        overlay.querySelector("#f-cat-expense").classList.toggle("hidden", v!=="expense");
        overlay.querySelector("#f-cat-income").classList.toggle("hidden", v!=="income");
        overlay.querySelector("#f-cat-transfer").classList.toggle("hidden", v!=="transfer");
      });
    }
  }
  // quickshop 类型切换：动态更新字段
  if(m.type==="quickshop"){
    const moodSeg = overlay.querySelector("#f-mood");
    if(moodSeg && window.__renderQSFields){
      moodSeg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
        moodSeg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on"));
        o.classList.add("on");
        const v = o.dataset.v;
        const dyn = overlay.querySelector("#quickshop-dynamic-fields");
        if(dyn){
          dyn.innerHTML = window.__renderQSFields(v);
          dyn.querySelectorAll(".seg").forEach(seg=>{
            const isMulti = seg.dataset.multi === "1";
            seg.querySelectorAll(".opt").forEach(opt=>opt.onclick=()=>{
              if(isMulti){
                opt.classList.toggle("on");
              } else {
                seg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on"));
                opt.classList.add("on");
              }
            });
          });
          // 重新绑定照片选择（动态区域重建后）；仅支持照片的记录类型显示，已选/已存照片保留
          if(['会员调理','散客消费','会员储值'].includes(v)){
            bindPhotoInput(overlay, overlay.__existingTokens || []);
          }
        }
      });
    }
  }
  // period 状态切换：显示/隐藏结束日期
  if(m.type==="period"){
    const statusSeg = overlay.querySelector("#f-status");
    if(statusSeg){
      statusSeg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
        statusSeg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on"));
        o.classList.add("on");
        const v = o.dataset.v;
        const endWrap = overlay.querySelector("#f-endwrap");
        if(endWrap) endWrap.classList.toggle("hidden", v !== "已结束");
      });
    }
  }
  if(editing) overlay.querySelector("#m-del").onclick=()=>{ close(); confirmDelete(key, d.id); };
  overlay.querySelector("#m-save").onclick=async ()=>{
    const val=id=>{ const el=overlay.querySelector(id); return el?el.value:undefined; };
    const seg=id=>{ const el=overlay.querySelector(id+" .on"); return el?el.dataset.v:undefined; };
    const multiSeg=id=>{ return Array.from(overlay.querySelectorAll(id+" .opt.on")).map(el=>el.dataset.v); };
    d.title=(val("#f-title")||"").trim()||"未命名";
    if(m.type==="todo"){ d.priority=seg("#f-prio")||d.priority; d.note=(val("#f-note")||"").trim(); }
    else if(m.type==="progress"){ d.current=Math.max(0,+val("#f-cur")||0); d.target=Math.max(1,+val("#f-tgt")||1); d.unit=(val("#f-unit")||"").trim(); d.note=(val("#f-note")||"").trim(); }
    else if(m.type==="weekly"){
      d.week=(val("#f-week")||"").trim();
      d.category=seg("#f-category")||"";
      d.priority=seg("#f-priority")||"";
      d.goalType=seg("#f-goaltype")||"";
      d.quantifiedTarget=+val("#f-quantified")||0;
      d.stage=seg("#f-stage")||"未开始";
      d.startDate=val("#f-startdate")||"";
      d.endDate=val("#f-enddate")||"";
      d.note=(val("#f-note")||"").trim();
    }
    else if(m.type==="period"){
      d.status=seg("#f-status")||"经期中";
      d.startDate=val("#f-startdate")||"";
      d.endDate=d.status==="已结束"?val("#f-enddate")||"":"";
      d.flowAmount=seg("#f-flow")||"";
      d.painLevel=seg("#f-pain")||"无";
      d.color=seg("#f-color")||"";
      d.texture=seg("#f-texture")||"";
      d.symptoms=multiSeg("#f-symptoms");
      d.emotions=multiSeg("#f-emotions");
      d.note=(val("#f-note")||"").trim();
      d.title = d.status + " · " + (d.startDate||"");
    }
    else if(m.type==="finance"){
      d.type=seg("#f-ftype")||"expense";
      d.amount=Math.max(0,+val("#f-amt")||0);
      d.date=val("#f-date");
      d.note=(val("#f-note")||"").trim();
      d.payMethod=seg("#f-paymethod")||"";
      if(d.type==="expense"){ d.bigCategory=seg("#f-bigcat")||""; d.smallCategory=seg("#f-smallcat")||""; delete d.incomeCategory; delete d.transferCategory; }
      else if(d.type==="income"){ d.incomeCategory=seg("#f-inccat")||""; delete d.bigCategory; delete d.smallCategory; delete d.transferCategory; }
      else if(d.type==="transfer"){ d.transferCategory=seg("#f-transcat")||""; delete d.bigCategory; delete d.smallCategory; delete d.incomeCategory; }
    }
    else if(m.type==="quickshop"){
      d.mood=seg("#f-mood")||d.mood||"";
      const sub = m.subFields?.[d.mood] || {};
      const flist = sub.fields || [];
      const multiSeg = id => { const el=overlay.querySelector(id); return el?Array.from(el.querySelectorAll(".opt.on")).map(o=>o.dataset.v):[]; };
      
      flist.forEach(fkey => {
        if(fkey === 'date') d.date = val("#f-date") || isoToday();
        else if(fkey === 'customer') d.customer = (val("#f-customer")||"").trim();
        else if(fkey === 'amount' || fkey === 'principal' || fkey === 'giftAmount' || fkey === 'beforePrincipal' || fkey === 'beforeGift' || fkey === 'sessionNum') {
          d[fkey] = +val("#f-"+fkey) || 0;
        } else if(fkey === 'project' || fkey === 'giftProject') {
          const segEl = overlay.querySelector("#f-"+fkey);
          if(segEl && segEl.dataset.multi === "1") {
            d[fkey] = multiSeg("#f-"+fkey);
          } else {
            d[fkey] = seg("#f-"+fkey) || "";
          }
        } else if(fkey === 'category') {
          d[fkey] = multiSeg("#f-"+fkey);
        } else if(fkey === 'payMethod' || fkey === 'channel' || fkey === 'level' || fkey === 'firstTime') {
          d[fkey] = seg("#f-"+fkey) || "";
        } else if(fkey === 'note') {
          d.note = (val("#f-note") || "").trim();
        } else {
          d[fkey] = (val("#f-"+fkey) || "").trim();
        }
      });
      
      let titleParts = [];
      if(d.customer) titleParts.push(d.customer);
      if(d.project) titleParts.push(Array.isArray(d.project) ? d.project.join("、") : d.project);
      if(d.amount) titleParts.push("¥" + d.amount);
      d.title = titleParts.length ? titleParts.join(" ") : (d.mood || "门店记录");
      if(!d.date) d.date = isoToday();
    }
    else if(m.type==="diary"){ d.content=(val("#f-content")||"").trim(); d.title=d.content.substring(0,20)+(d.content.length>20?"...":""); d.date=val("#f-date"); }
    else if(m.key==="content"){ d.stage=seg("#f-stage")||d.stage||""; d.content=(val("#f-content")||"").trim(); d.date=val("#f-date"); }
    else if(m.type==="note"){ d.mood=seg("#f-mood")||d.mood||""; d.content=(val("#f-content")||"").trim(); d.date=val("#f-date"); }
    // save custom fields
    (m.fields||[]).forEach(f=>{
      if(f.type==="select") d[f.key]=seg("#f-cf-"+f.key)||d[f.key]||"";
      else if(f.type==="number") d[f.key]=Math.max(0,+val("#f-cf-"+f.key)||0);
      else d[f.key]=(val("#f-cf-"+f.key)||"").trim();
    });
    // 照片：仅支持照片的类型处理（会员调理/散客消费/会员储值，以及日记/内容封面）
    // 已存 token（可在表单里删）+ 新选文件（压缩后上传），整体覆盖写回飞书附件字段
    const qsPhotoMoods = ['会员调理','散客消费','会员储值'];
    const photoEnabled = m.type==="quickshop" ? qsPhotoMoods.includes(d.mood)
                       : (m.type==="diary" || m.key==="content");
    if(photoEnabled){
      const existingTokens = overlay.__existingTokens || [];
      const photoFiles = overlay.__photoFiles || [];
      if(photoFiles.length){
        const saveBtn = overlay.querySelector("#m-save");
        saveBtn.disabled = true; saveBtn.textContent = "上传照片中…";
        try {
          const tokens = await uploadPhotosToFeishu(photoFiles, m.key, d.mood);
          d.photo = existingTokens.concat(tokens);
        } catch(e) {
          saveBtn.disabled = false; saveBtn.textContent = "保存";
          alert("照片上传失败：" + e.message + "\n记录未保存，请检查网络后重试。");
          return;
        }
      } else {
        d.photo = existingTokens;
      }
    }
    if(!editing) (data[key]=data[key]||[]).unshift(d);
    persist(); close();
  };
}

function newItem(m){
  const base={ id: Date.now() };
  let item;
  if(m.type==="todo") item={...base, title:"", priority:(m.priorities&&m.priorities[1]?m.priorities[1].key:"P1"), done:false, note:""};
  else if(m.type==="checkin") item={...base, title:"", log:{}};
  else if(m.type==="progress") item={...base, title:"", current:0, target: (m.unit==="页"?100:20), unit:m.unit||"", note:""};
  else if(m.type==="finance") item={...base, title:"", type:"expense", amount:0, bigCategory:"", smallCategory:"", incomeCategory:"", transferCategory:"", payMethod:"", note:"", date:isoToday()};
  else if(m.type==="quickshop") item={...base, title:"", mood:(m.moods&&m.moods[0])||"会员消费", customer:"", amount:0, project:"", feedback:"", date:isoToday()};
  else if(m.type==="diary") item={...base, title:"", content:"", mood:"想法", date:isoToday()};
  else if(m.key==="content") item={...base, title:"", content:"", stage:(m.stages&&m.stages[0])||"选题池", date:isoToday()};
  else item={...base, title:"", content:"", mood:(m.moods&&m.moods[0])||"", date:isoToday()};
  // initialize custom fields
  (m.fields||[]).forEach(f=>{ if(!(f.key in item)) item[f.key]= f.type==="select"?(f.options&&f.options[0]||""):""; });
  return item;
}

/* ---------- delete confirm ---------- */
function confirmDelete(key,id){ const item=(data[key]||[]).find(i=>i.id==id); if(!item) return;
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal" style="width:400px"><h3>删除记录</h3><div class="sub">确定删除「${esc(item.title||'这条记录')}」？此操作不可撤销。</div>
    <div class="modal-actions"><div class="spacer"></div><button class="btn ghost" id="c-cancel">取消</button><button class="btn danger" id="c-ok">删除</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#c-cancel").onclick=close;
  overlay.querySelector("#c-ok").onclick=()=>{ data[key]=data[key].filter(i=>i.id!=id); persist(); close(); };
}

/* ---------- router / sidebar ---------- */
function dateStr(){ const n=new Date(); const wd="日一二三四五六"[n.getDay()]; return `${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日 周${wd}`; }
function cnDate(iso){ if(!iso) return ''; const p=iso.split('-'); return `${p[0]}年${parseInt(p[1])}月${parseInt(p[2])}日`; }
function go(v){ view=v; searchQ=""; renderNavActive(); render(); window.scrollTo({top:0}); }
function render(){ if(view==="home") renderHome(); else if(view==="insight") renderInsight(); else renderModule(view); }

function buildNav(){
  $("#brandName").textContent=CONFIG.owner; $("#brandSlogan").textContent=CONFIG.slogan;
  const html=[`<div class="navi" data-go="home">${icon("home",19)}首页</div>`,
    `<div class="nav-sep">功能模块</div>`]
    .concat(CONFIG.modules.map(m=>`<div class="navi" data-go="${m.key}">${icon(m.icon,19)}${m.name}</div>`))
    .concat([`<div class="nav-sep">统计</div>`, `<div class="navi" data-go="insight">${icon("chart",19)}洞察复盘</div>`]);
  $("#nav").innerHTML=html.join("");
  $("#nav").querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>go(el.dataset.go));
  renderNavActive();
}
function renderNavActive(){ $("#nav").querySelectorAll(".navi").forEach(el=>el.classList.toggle("active", el.dataset.go===view)); }

/* ---------- avatar upload ---------- */
$("#avaCam").innerHTML = icon("camera",18);
if(data.__avatar) $("#avaImg").src = data.__avatar;
$("#ava").onclick = () => $("#avatarInput").click();
$("#avatarInput").onchange = e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = () => { data.__avatar = reader.result; $("#avaImg").src = reader.result; store.save(); };
  reader.readAsDataURL(f);
  e.target.value = "";
};

/* ---------- utils ---------- */
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function attr(s){ return esc(s).replace(/"/g,'&quot;'); }

buildNav();
render();

(function checkVersion(){
  const lastVer = localStorage.getItem("xzz_app_version");
  const currentVer = CONFIG.version;
  if(lastVer && lastVer !== currentVer){
    localStorage.setItem("xzz_app_version", currentVer);
    
    // v20261009-1: 清空推送型模块（门店随手记、生活收支、例假记录），从飞书重新开始
    if(lastVer < "20261009-1"){
      const key = CONFIG.storageKey;
      try {
        const d = JSON.parse(localStorage.getItem(key) || "{}");
        d.quickshop = [];
        d.money = [];
        d.period = [];
        localStorage.setItem(key, JSON.stringify(d));
        console.log("版本升级：已清空门店随手记、生活收支、例假记录");
      } catch(e){}
    }
    
    // v20261009-2: 重新从飞书拉取待办和周计划，确保数据最新
    if(lastVer < "20261009-2"){
      const key = CONFIG.storageKey;
      try {

        d.todo = [];
        d.weeklylearn = [];

        ];

      } catch(e){}

    // 强制刷新绕过缓存
    if(performance.navigation && performance.navigation.type === 1){

  } else {
    localStorage.setItem("xzz_app_version", currentVer);
  }
})();
